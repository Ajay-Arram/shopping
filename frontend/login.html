<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Shopping Cart</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--primary);
      margin-bottom: 24px;
    }
    .auth-logo svg {
      width: 38px;
      height: 38px;
      fill: var(--accent);
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 28px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .auth-title {
      font-size: 1.7rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #888c8c;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 4px rgba(228, 121, 17, 0.4);
    }
    .auth-submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 0.95rem;
    }
    .auth-divider {
      position: relative;
      text-align: center;
      margin: 24px 0 16px;
    }
    .auth-divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e3e6e6;
    }
    .auth-divider span {
      position: relative;
      background: #ffffff;
      padding: 0 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .auth-toggle-btn {
      width: 100%;
      padding: 9px;
      font-size: 0.88rem;
    }
    .auth-disclaimer {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 18px;
      line-height: 1.4;
    }
  </style>
</head>
<body class="auth-page">

  <a href="index.html" class="auth-logo">
    <svg viewBox="0 0 24 24">
      <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12zm-7-8c-1.66 0-3-1.34-3-3H7c0 2.76 2.24 5 5 5s5-2.24 5-5h-2c0 1.66-1.34 3-3 3z"/>
    </svg>
    <div class="logo-text" style="color:var(--primary); font-size:1.6rem;">Shopping<span style="color:var(--accent);">Cart</span></div>
  </a>

  <div class="auth-card">
    <h1 class="auth-title" id="auth-heading">Sign in</h1>

    <form id="auth-form">
      <div class="form-group">
        <label for="username-input" class="form-label">Username</label>
        <input type="text" id="username-input" class="form-control" required autocomplete="username">
      </div>

      <div class="form-group" id="email-group" style="display: none;">
        <label for="email-input" class="form-label">Email (Optional)</label>
        <input type="email" id="email-input" class="form-control" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password-input" class="form-label">Password</label>
        <input type="password" id="password-input" class="form-control" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary auth-submit-btn" id="auth-btn">
        Sign in
      </button>

      <p class="auth-disclaimer">
        By continuing, you agree to Shopping Cart's Conditions of Use and Privacy Notice.
      </p>
    </form>

    <div class="auth-divider">
      <span id="divider-text">New to Shopping Cart?</span>
    </div>

    <button type="button" class="btn btn-outline auth-toggle-btn" id="toggle-auth-mode-btn">
      Create your Shopping Cart account
    </button>
  </div>

  <footer style="margin-top:auto; padding:20px; text-align:center; font-size:0.75rem; color:#888;">
    &copy; 2026 Shopping Cart Inc. Powered by Django Authentication.
  </footer>

  <script src="js/products.js"></script>
  <script>
    let isRegisterMode = false;

    const authHeading = document.getElementById('auth-heading');
    const authBtn = document.getElementById('auth-btn');
    const emailGroup = document.getElementById('email-group');
    const toggleBtn = document.getElementById('toggle-auth-mode-btn');
    const dividerText = document.getElementById('divider-text');
    const authForm = document.getElementById('auth-form');

    toggleBtn.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        authHeading.textContent = 'Create account';
        authBtn.textContent = 'Create your account';
        emailGroup.style.display = 'block';
        dividerText.textContent = 'Already have an account?';
        toggleBtn.textContent = 'Sign in instead';
      } else {
        authHeading.textContent = 'Sign in';
        authBtn.textContent = 'Sign in';
        emailGroup.style.display = 'none';
        dividerText.textContent = 'New to Shopping Cart?';
        toggleBtn.textContent = 'Create your Shopping Cart account';
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value;
      const email = document.getElementById('email-input').value.trim();

      const originalBtnText = authBtn.textContent;
      authBtn.disabled = true;
      authBtn.textContent = 'Processing...';

      const endpoint = isRegisterMode ? '/auth/register/' : '/auth/login/';
      const payload = isRegisterMode ? { username, password, email } : { username, password };

      try {
        const data = await fetchAPI(endpoint, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        if (data && data.csrfToken && typeof setCsrfToken === 'function') {
          setCsrfToken(data.csrfToken);
        }

        showToast(isRegisterMode ? 'Account created successfully!' : 'Signed in successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (err) {
        showToast(err.message || 'Authentication failed', 'error');
        authBtn.disabled = false;
        authBtn.textContent = originalBtnText;
      }
    });
  </script>
</body>
</html>
